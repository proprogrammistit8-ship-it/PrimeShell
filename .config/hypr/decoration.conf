decoration {
    rounding = 10
    rounding_power = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    # Размытие
    blur {
        enabled = true
        size = 5
        passes = 5

        vibrancy = 0.1696
    }
}
